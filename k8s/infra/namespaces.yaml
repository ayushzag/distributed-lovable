# k8s/infra/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: lovable-core
---
apiVersion: v1
kind: Namespace
metadata:
  name: lovable-previews
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lovable-shared-config
  namespace: lovable-core
data:
  PREVIEW_DOMAIN: "previews.codingshuttle.in"
  PREVIEW_NAMESPACE: "lovable-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "http://codingshuttle.in"
  # Same-origin /api routing is used in production. Add production origins here only if API is hosted separately.
  CORS_ALLOWED_ORIGINS: "http://localhost:5173"
