spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          # Create this repository under your own GitHub account before deploying.
          uri: ${CONFIG_GIT_URI:https://github.com/ayushzag/lovable-config-server}
          username: ${GIT_USERNAME:}
          password: ${GIT_PASSWORD:}
          default-label: main

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: k8s
  cloud:
    discovery:
      enabled: false
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/ayushzag/lovable-config-server}
          username: ${GIT_USERNAME:}
          password: ${GIT_PASSWORD:}
          default-label: main

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
