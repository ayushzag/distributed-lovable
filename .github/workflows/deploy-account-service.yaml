name: Deploy Account Service

# Manual until Docker Hub and GKE secrets are configured. Push-based CI/CD is enabled in Part 5.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: account-service
  IMAGE_NAME: ayushzag/lovable-account-service

jobs:
  build-and-deploy:
    name: Build, push, and deploy to GKE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and install Common Lib
        working-directory: ./common-lib
        run: ./mvnw clean install -DskipTests

      - name: Build and push Docker image with Jib
        working-directory: ./account-service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./mvnw compile jib:build \
            -Djib.to.image=docker.io/ayushzag/lovable-account-service:${{ github.sha }} \
            -Djib.to.tags=latest \
            -Djib.to.auth.username="$DOCKERHUB_USERNAME" \
            -Djib.to.auth.password="$DOCKERHUB_TOKEN"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/account-service account-service=docker.io/ayushzag/lovable-account-service:${{ github.sha }} -n lovable-core
          kubectl rollout status deployment/account-service -n lovable-core
