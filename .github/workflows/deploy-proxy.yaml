name: Deploy Preview Proxy

# Manual until Docker Hub and GKE secrets are configured. Push-based CI/CD is enabled in Part 5.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: ayushzag/lovable-me-proxy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./k8s/proxy
          file: ./k8s/proxy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Authenticate to Google Cloud
        if: ${{ vars.DEPLOY_TO_GKE == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Get GKE credentials
        if: ${{ vars.DEPLOY_TO_GKE == 'true' }}
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Deploy proxy to GKE
        if: ${{ vars.DEPLOY_TO_GKE == 'true' }}
        run: |
          kubectl set image deployment/lovable-me-proxy lovable-me-proxy=${{ env.IMAGE_NAME }}:${{ github.sha }} -n lovable-core
          kubectl rollout status deployment/lovable-me-proxy -n lovable-core
